<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>الرياض</title>
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
      /* Everything is sized in vw: the screen is always 16:9. */
      body {
        font-family: "Noto Sans Arabic", "Noto Naskh Arabic", sans-serif;
        color: #fff;
        background: #070d22;
        /* Skyline colours per phase; `fill` transitions, so phases blend. */
        --far: #1a2550;
        --near: #0a1131;
        --sphere: #ffd27a;
        --lit: 0.75;
      }
      body[data-phase="dawn"] {
        --far: rgba(84, 70, 124, 0.5);
        --near: #2a2850;
        --sphere: #f3b26a;
        --lit: 0.3;
      }
      body[data-phase="day"] {
        --far: rgba(96, 128, 156, 0.35);
        --near: rgba(70, 100, 128, 0.62);
        --sphere: #e2b45c;
        --lit: 0;
      }
      body[data-phase="dusk"] {
        --far: rgba(92, 56, 98, 0.5);
        --near: #281d44;
        --sphere: #ffc874;
        --lit: 0.55;
      }
      /* No fades until the first phase is painted, so the app opens in the
         right sky instead of drifting there from night over 90 s. */
      body.boot * {
        transition: none !important;
      }
      .sky {
        position: absolute;
        inset: 0;
        opacity: 0;
        transition: opacity 90s linear;
      }
      .sky.night {
        opacity: 1;
        background: linear-gradient(170deg, #070d22 0%, #15214a 55%, #33355f 100%);
      }
      .sky.dawn {
        background: linear-gradient(170deg, #27386a 0%, #7d6a9c 45%, #e9a58c 80%, #f6cf9e 100%);
      }
      .sky.day {
        background: linear-gradient(170deg, #5d9cc9 0%, #9cc6df 45%, #f2d3a2 100%);
      }
      .sky.dusk {
        background: linear-gradient(170deg, #34457a 0%, #a8668c 45%, #ee8a4e 80%, #f6c26c 100%);
      }
      body[data-phase="dawn"] .sky.dawn,
      body[data-phase="day"] .sky.day,
      body[data-phase="dusk"] .sky.dusk {
        opacity: 1;
      }
      .stars {
        position: absolute;
        inset: 0;
        background-image:
          radial-gradient(0.25vw 0.25vw at 20% 18%, #fff 50%, transparent 100%),
          radial-gradient(0.2vw 0.2vw at 34% 8%, #fff 50%, transparent 100%),
          radial-gradient(0.18vw 0.18vw at 52% 26%, #fff 50%, transparent 100%),
          radial-gradient(0.22vw 0.22vw at 12% 40%, #fff 50%, transparent 100%),
          radial-gradient(0.16vw 0.16vw at 44% 36%, #fff 50%, transparent 100%),
          radial-gradient(0.2vw 0.2vw at 62% 12%, #fff 50%, transparent 100%),
          radial-gradient(0.15vw 0.15vw at 57% 46%, #fff 50%, transparent 100%),
          radial-gradient(0.18vw 0.18vw at 84% 6%, #fff 50%, transparent 100%),
          radial-gradient(0.15vw 0.15vw at 28% 52%, #fff 50%, transparent 100%);
        transition: opacity 90s linear;
      }
      body[data-phase="dawn"] .stars,
      body[data-phase="dusk"] .stars {
        opacity: 0.3;
      }
      body[data-phase="day"] .stars {
        opacity: 0;
      }
      .sun,
      .moon {
        position: absolute;
        border-radius: 50%;
        transition:
          opacity 90s linear,
          top 90s ease,
          background 90s linear;
      }
      .sun {
        top: 3vw;
        left: 46vw;
        width: 9vw;
        height: 9vw;
        opacity: 0;
        background: radial-gradient(circle, #fff6dc 0 40%, rgba(255, 240, 200, 0) 70%);
      }
      body[data-phase="day"] .sun {
        opacity: 1;
      }
      body[data-phase="dawn"] .sun,
      body[data-phase="dusk"] .sun {
        top: 22vw;
        opacity: 1;
        background: radial-gradient(circle, #ffe0a8 0 38%, rgba(255, 190, 120, 0) 70%);
      }
      .moon {
        top: 5vw;
        left: 47vw;
        width: 5.5vw;
        height: 5.5vw;
        box-shadow: inset -1.6vw -0.6vw 0 0 #f3efe0;
        filter: drop-shadow(0 0 1.2vw rgba(243, 239, 224, 0.45));
      }
      body[data-phase="day"] .moon,
      body[data-phase="dawn"] .moon,
      body[data-phase="dusk"] .moon {
        opacity: 0;
      }
      .city {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        width: 100%;
        height: 19vw;
      }
      .city path,
      .city ellipse,
      .city g {
        transition:
          fill 90s linear,
          opacity 90s linear;
      }
      .city .far {
        fill: var(--far);
      }
      .city .near {
        fill: var(--near);
        fill-rule: evenodd;
      }
      .city .sphere {
        fill: var(--sphere);
      }
      .city .lit {
        fill: #ffcf7a;
        opacity: var(--lit);
      }
      .info {
        position: absolute;
        top: 5vw;
        right: 6vw;
        /* Fixed width so the verse card can be wide; ends well clear of the
           prayer panel (which stops at 38vw). */
        width: 46vw;
        text-align: right;
        text-shadow: 0 0.2vw 1.5vw rgba(20, 40, 70, 0.3);
      }
      /* City on the right, weather on the left, lifted towards the top edge;
         the clock below stays where it was. */
      .head {
        display: flex;
        /* Weather sits on the same line as "الرياض" (first baseline), a fixed
           gap to its left whatever the column width. */
        align-items: baseline;
        gap: 8.5vw;
        /* Bottom margin collapses with the clock's 1.2vw top margin. */
        margin: -2.6vw 0 3.8vw;
      }
      .place {
        font-size: 2.4vw;
        font-weight: 700;
        letter-spacing: 0.02em;
      }
      .place small {
        display: block;
        font-size: 1.4vw;
        font-weight: 400;
        opacity: 0.8;
        margin-top: 0.3vw;
      }
      .num {
        direction: ltr;
        unicode-bidi: isolate;
        font-variant-numeric: tabular-nums;
      }
      /* Flex items keep the ص/م marker on the left of the digits; as plain
         inline text the bidi algorithm would move it to the right. */
      .clock,
      .prayer > .num {
        display: inline-flex;
        align-items: baseline;
        direction: ltr;
      }
      .clock {
        display: flex;
        justify-content: flex-end;
        font-size: 9vw;
        font-weight: 300;
        line-height: 1;
        margin-top: 1.2vw;
      }
      .clock .period {
        font-size: 2.6vw;
        font-weight: 400;
        opacity: 0.8;
        margin-inline-end: 0.8vw;
      }
      .dates {
        font-size: 2vw;
        margin-top: 1.2vw;
        opacity: 0.92;
      }
      .weather {
        font-size: 1.9vw;
      }
      .status {
        margin-top: 1.6vw;
        font-size: 1.5vw;
        opacity: 0.85;
      }
      .status:empty {
        display: none;
      }
      /* Verse card under the dates; glass so it stays legible over the sky
         and the skyline. */
      .ayah {
        margin-top: 2vw;
        padding: 1.3vw 1.8vw 1.1vw;
        border-radius: 1.6vw;
        background: rgba(255, 255, 255, 0.14);
        -webkit-backdrop-filter: blur(1vw);
        backdrop-filter: blur(1vw);
        border: 0.12vw solid rgba(255, 255, 255, 0.3);
        text-shadow: none;
        transition: opacity 1.2s ease;
      }
      body[data-phase="day"] .ayah {
        background: rgba(28, 58, 92, 0.24);
      }
      .ayah.out {
        opacity: 0;
      }
      .ayah-text {
        font-family: "Noto Naskh Arabic", "Noto Sans Arabic", serif;
        font-size: 2.05vw;
        font-weight: 700;
        line-height: 2;
      }
      .ayah-ref {
        text-align: left;
        font-size: 1.15vw;
        opacity: 0.85;
        margin-top: 0.4vw;
      }
      .glass {
        position: absolute;
        top: 5vw;
        bottom: 5vw;
        left: 5vw;
        width: 33vw;
        border-radius: 2vw;
        background: rgba(255, 255, 255, 0.14);
        -webkit-backdrop-filter: blur(1vw);
        backdrop-filter: blur(1vw);
        border: 0.12vw solid rgba(255, 255, 255, 0.3);
        padding: 2.2vw 2.4vw;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
      }
      .prayer {
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 2.5vw;
        padding: 0.9vw 1.4vw;
        border-radius: 1.2vw;
        transition: background 1s ease;
      }
      .prayer .period {
        font-size: 1.3vw;
        opacity: 0.75;
        margin-inline-end: 0.4vw;
      }
      .prayer.active {
        background: rgba(255, 255, 255, 0.92);
        color: #23365e;
        font-weight: 700;
        text-shadow: none;
      }
      .prayer .left {
        display: block;
        font-size: 1.5vw;
        font-weight: 500;
        color: #b9772b;
      }
    </style>
  </head>
  <body data-phase="night" class="boot">
    <div class="sky night"></div>
    <div class="sky dawn"></div>
    <div class="sky day"></div>
    <div class="sky dusk"></div>
    <div class="stars"></div>
    <div class="sun"></div>
    <div class="moon"></div>
    <!-- Riyadh: Kingdom Centre (x≈110) and Al Faisaliah (x≈135). The viewBox is
         stretched to the 100vw × 19vw strip, so the sphere is an ellipse. -->
    <svg class="city" viewBox="0 0 160 40" preserveAspectRatio="none" aria-hidden="true">
      <path class="far" d="M0 40V30h6v-4h7v3h6v-6h5v4h8v-7h6v5h7v-3h6v6h5v-8h7v4h6v-2h8v5h6v-6h7v3h5v-4h8v6h6v-5h7v2h6v-7h5v5h8v-3h6v4h7v-6h6v5h5v-3h7v6h6v-4h8v5h5v-3h7V40z" />
      <path class="near" d="M0 40V33h5v-3h6v4h4v-6h5v2h7v-5h5v4h6v3h4v-7h6v5h5v-2h6v4h5v-6h4v3h7v-5h5v6h6v3h4v-4h6v6h5V40z M105 40L106.4 12Q110.5 1 114.6 12L116 40z M108.2 15.5Q110.5 6 112.8 15.5z M119 40v-9h5v-3h5v12z M131 40L134 18L135.4 9.5L136.8 18L139.8 40z M142 40v-11h5v4h5v-7h6v3h2V40z" />
      <ellipse class="sphere" cx="135.4" cy="17.5" rx="1.7" ry="2.24" />
      <g class="lit">
        <rect x="17" y="30" width=".7" height=".9" /><rect x="21" y="32" width=".7" height=".9" /><rect x="41" y="31" width=".7" height=".9" />
        <rect x="57" y="33" width=".7" height=".9" /><rect x="71" y="30" width=".7" height=".9" /><rect x="88" y="34" width=".7" height=".9" />
        <rect x="108.5" y="24" width=".6" height=".8" /><rect x="111.6" y="28" width=".6" height=".8" /><rect x="109.8" y="33" width=".6" height=".8" />
        <rect x="134.6" y="27" width=".6" height=".8" /><rect x="136.2" y="32" width=".6" height=".8" /><rect x="145" y="33" width=".7" height=".9" />
        <rect x="155" y="31" width=".7" height=".9" />
      </g>
    </svg>
    <main class="info">
      <div class="head">
        <div class="place">الرياض<small>المملكة العربية السعودية</small></div>
        <div class="weather">
          <span id="weather-icon">☾</span>
          <span class="num" id="temperature">--°</span>
          <span id="weather">جارٍ تحديث الطقس</span>
        </div>
      </div>
      <div class="clock num" id="clock">--:--</div>
      <div class="dates"><span id="date"></span> · <span id="hijri"></span></div>
      <div class="status" id="status">جارٍ تحميل مواقيت الصلاة</div>
      <div class="ayah" id="ayah">
        <div class="ayah-text" id="ayah-text"></div>
        <div class="ayah-ref" id="ayah-ref"></div>
      </div>
    </main>
    <section class="glass" id="prayers"></section>
    <script>
      var names = [
          ["Fajr", "الفجر"],
          // Not a prayer, but it marks the end of Fajr time, so it is counted
          // down to like the others.
          ["Sunrise", "الشروق"],
          ["Dhuhr", "الظهر"],
          ["Asr", "العصر"],
          ["Maghrib", "المغرب"],
          ["Isha", "العشاء"],
        ],
        // Prayer timings keyed by dayKey(); Java sends a week at a time so the
        // screen keeps working through an outage.
        days = {},
        prayersFailed = false,
        weather = null,
        weatherFailed = false;
      // Android passes the coordinates; the defaults only serve a browser preview.
      var query = new URLSearchParams(location.search),
        place = {
          lat: +query.get("lat") || 24.7136,
          lon: +query.get("lon") || 46.6753,
        };
      var $ = function (id) {
          return document.getElementById(id);
        },
        ar = function (n) {
          return String(n);
        };
      function formatTime(value, periodFirst) {
        var p = value && value.match(/^(\d\d):(\d\d)/);
        if (!p) return "--:--";
        var hour = +p[1],
          display = hour % 12 || 12,
          number = display + ":" + p[2],
          period =
            '<span class="period">' + (hour < 12 ? "ص" : "م") + "</span>";
        return periodFirst ? period + number : number + period;
      }
      function dayKey(offset) {
        return new Intl.DateTimeFormat("en-GB", {
          timeZone: "Asia/Riyadh",
          year: "numeric",
          month: "2-digit",
          day: "2-digit",
        })
          .format(new Date(Date.now() + offset * 86400000))
          .replace(/\//g, "-");
      }
      function prayerSeconds(value) {
        var p = value && value.match(/^(\d\d):(\d\d)/);
        return p ? +p[1] * 3600 + +p[2] * 60 : null;
      }
      function solarTimes() {
        var date = dayKey(0).split("-"),
          year = +date[2],
          month = +date[1],
          day = +date[0],
          n =
            (Date.UTC(year, month - 1, day) - Date.UTC(year, 0, 0)) / 86400000,
          gamma = ((2 * Math.PI) / 365) * (n - 1),
          eq =
            229.18 *
            (0.000075 +
              0.001868 * Math.cos(gamma) -
              0.032077 * Math.sin(gamma) -
              0.014615 * Math.cos(2 * gamma) -
              0.040849 * Math.sin(2 * gamma)),
          decl =
            0.006918 -
            0.399912 * Math.cos(gamma) +
            0.070257 * Math.sin(gamma) -
            0.006758 * Math.cos(2 * gamma) +
            0.000907 * Math.sin(2 * gamma) -
            0.002697 * Math.cos(3 * gamma) +
            0.00148 * Math.sin(3 * gamma),
          lat = (place.lat * Math.PI) / 180,
          angle =
            (Math.acos(
              Math.cos((90.833 * Math.PI) / 180) /
                (Math.cos(lat) * Math.cos(decl)) -
                Math.tan(lat) * Math.tan(decl),
            ) *
              180) /
            Math.PI,
          noon = 720 - 4 * place.lon - eq + 180;
        return {
          sunrise: (noon - 4 * angle) * 60,
          sunset: (noon + 4 * angle) * 60,
        };
      }
      function renderSky() {
        var parts = new Intl.DateTimeFormat("en-GB", {
            timeZone: "Asia/Riyadh",
            hour: "2-digit",
            minute: "2-digit",
            second: "2-digit",
            hour12: false,
          })
            .format(new Date())
            .split(":"),
          now = +parts[0] * 3600 + +parts[1] * 60 + +parts[2],
          solar = solarTimes(),
          times = days[dayKey(0)],
          sunrise = times ? prayerSeconds(times.Sunrise) : null,
          sunset = times ? prayerSeconds(times.Sunset) : null,
          fajr = times ? prayerSeconds(times.Fajr) : null;
        if (sunrise === null || sunset === null || sunrise >= sunset) {
          sunrise = solar.sunrise;
          sunset = solar.sunset;
        }
        if (fajr === null || fajr >= sunrise) fajr = sunrise - 80 * 60;
        // Dawn runs from Fajr to sunrise; dusk from 45 min before sunset to
        // 40 min after. The CSS fades between phases.
        document.body.setAttribute(
          "data-phase",
          now >= fajr && now < sunrise
            ? "dawn"
            : now >= sunrise && now < sunset - 2700
              ? "day"
              : now >= sunset - 2700 && now < sunset + 2400
                ? "dusk"
                : "night",
        );
        $("weather-icon").textContent =
          now >= sunrise && now < sunset ? "☀" : "☾";
      }
      function nextPrayer(today, nextDay, now) {
        if (!today) return null;
        for (var i = 0; i < names.length; i++) {
          var at = prayerSeconds(today[names[i][0]]);
          if (at !== null && at > now)
            return { index: i, remaining: at - now, name: names[i][1] };
        }
        var fajr = nextDay ? prayerSeconds(nextDay.Fajr) : null;
        return fajr !== null
          ? { index: -1, remaining: 86400 - now + fajr, name: "الفجر غدًا" }
          : { index: -1, remaining: null, name: "الفجر غدًا" };
      }
      // "بعد 37 دقيقة" under an hour, "بعد 6:55 ساعة" above it.
      function remainingText(seconds) {
        var minutes = Math.ceil(seconds / 60);
        if (minutes >= 60) {
          return (
            'بعد <span class="num">' +
            Math.floor(minutes / 60) +
            ":" +
            String(minutes % 60).padStart(2, "0") +
            "</span> ساعة"
          );
        }
        if (minutes <= 1) return "بعد دقيقة";
        if (minutes === 2) return "بعد دقيقتين";
        return (
          'بعد <span class="num">' +
          minutes +
          "</span> " +
          (minutes <= 10 ? "دقائق" : "دقيقة")
        );
      }
      function renderClock() {
        var now = new Date();
        $("clock").innerHTML = formatTime(
          new Intl.DateTimeFormat("en-GB", {
            timeZone: "Asia/Riyadh",
            hour: "2-digit",
            minute: "2-digit",
            hour12: false,
          }).format(now),
          true,
        );
        $("date").textContent = new Intl.DateTimeFormat(
          "ar-SA-u-ca-gregory-nu-latn",
          {
            timeZone: "Asia/Riyadh",
            weekday: "long",
            day: "numeric",
            month: "long",
          },
        ).format(now);
        $("hijri").textContent = new Intl.DateTimeFormat(
          "ar-SA-u-ca-islamic-umalqura-nu-latn",
          {
            timeZone: "Asia/Riyadh",
            day: "numeric",
            month: "long",
            year: "numeric",
          },
        ).format(now);
        renderSky();
        renderPrayers();
        renderWeather();
        renderAyah();
      }
      // Verses are stored verbatim (Hafs, Uthmani script, King Fahd Complex
      // edition) from the Quranpedia.net dump, version 2026-10-19
      // (https://quranpedia.net/dumps), and checked letter for letter against
      // Tanzil. Do not edit the text. Listed in reading order so that
      // consecutive verses (e.g. Al-Ikhlas 1–4) appear in sequence.
      var VERSES = [
          { s: 2, a: 45, name: "البقرة", text: "وَٱسۡتَعِينُواْ بِٱلصَّبۡرِ وَٱلصَّلَوٰةِۚ وَإِنَّهَا لَكَبِيرَةٌ إِلَّا عَلَى ٱلۡخَٰشِعِينَ" },
          { s: 2, a: 152, name: "البقرة", text: "فَٱذۡكُرُونِيٓ أَذۡكُرۡكُمۡ وَٱشۡكُرُواْ لِي وَلَا تَكۡفُرُونِ" },
          { s: 2, a: 153, name: "البقرة", text: "يَٰٓأَيُّهَا ٱلَّذِينَ ءَامَنُواْ ٱسۡتَعِينُواْ بِٱلصَّبۡرِ وَٱلصَّلَوٰةِۚ إِنَّ ٱللَّهَ مَعَ ٱلصَّٰبِرِينَ" },
          { s: 2, a: 186, name: "البقرة", text: "وَإِذَا سَأَلَكَ عِبَادِي عَنِّي فَإِنِّي قَرِيبٌۖ أُجِيبُ دَعۡوَةَ ٱلدَّاعِ إِذَا دَعَانِۖ فَلۡيَسۡتَجِيبُواْ لِي وَلۡيُؤۡمِنُواْ بِي لَعَلَّهُمۡ يَرۡشُدُونَ" },
          { s: 2, a: 201, name: "البقرة", text: "وَمِنۡهُم مَّن يَقُولُ رَبَّنَآ ءَاتِنَا فِي ٱلدُّنۡيَا حَسَنَةٗ وَفِي ٱلۡأٓخِرَةِ حَسَنَةٗ وَقِنَا عَذَابَ ٱلنَّارِ" },
          { s: 2, a: 238, name: "البقرة", text: "حَٰفِظُواْ عَلَى ٱلصَّلَوَٰتِ وَٱلصَّلَوٰةِ ٱلۡوُسۡطَىٰ وَقُومُواْ لِلَّهِ قَٰنِتِينَ" },
          { s: 3, a: 8, name: "آل عمران", text: "رَبَّنَا لَا تُزِغۡ قُلُوبَنَا بَعۡدَ إِذۡ هَدَيۡتَنَا وَهَبۡ لَنَا مِن لَّدُنكَ رَحۡمَةًۚ إِنَّكَ أَنتَ ٱلۡوَهَّابُ" },

          { s: 15, a: 49, name: "الحجر", text: "۞ نَبِّئۡ عِبَادِيٓ أَنِّيٓ أَنَا ٱلۡغَفُورُ ٱلرَّحِيمُ" },
          { s: 16, a: 128, name: "النحل", text: "إِنَّ ٱللَّهَ مَعَ ٱلَّذِينَ ٱتَّقَواْ وَّٱلَّذِينَ هُم مُّحۡسِنُونَ" },
          { s: 17, a: 78, name: "الإسراء", text: "أَقِمِ ٱلصَّلَوٰةَ لِدُلُوكِ ٱلشَّمۡسِ إِلَىٰ غَسَقِ ٱلَّيۡلِ وَقُرۡءَانَ ٱلۡفَجۡرِۖ إِنَّ قُرۡءَانَ ٱلۡفَجۡرِ كَانَ مَشۡهُودٗا" },
          { s: 18, a: 10, name: "الكهف", text: "إِذۡ أَوَى ٱلۡفِتۡيَةُ إِلَى ٱلۡكَهۡفِ فَقَالُواْ رَبَّنَآ ءَاتِنَا مِن لَّدُنكَ رَحۡمَةٗ وَهَيِّئۡ لَنَا مِنۡ أَمۡرِنَا رَشَدٗا" },
          { s: 20, a: 14, name: "طه", text: "إِنَّنِيٓ أَنَا ٱللَّهُ لَآ إِلَٰهَ إِلَّآ أَنَا۠ فَٱعۡبُدۡنِي وَأَقِمِ ٱلصَّلَوٰةَ لِذِكۡرِيٓ" },
          { s: 20, a: 25, name: "طه", text: "قَالَ رَبِّ ٱشۡرَحۡ لِي صَدۡرِي" },
          { s: 20, a: 26, name: "طه", text: "وَيَسِّرۡ لِيٓ أَمۡرِي" },
          { s: 20, a: 132, name: "طه", text: "وَأۡمُرۡ أَهۡلَكَ بِٱلصَّلَوٰةِ وَٱصۡطَبِرۡ عَلَيۡهَاۖ لَا نَسۡــَٔلُكَ رِزۡقٗاۖ نَّحۡنُ نَرۡزُقُكَۗ وَٱلۡعَٰقِبَةُ لِلتَّقۡوَىٰ" },
          { s: 23, a: 1, name: "المؤمنون", text: "قَدۡ أَفۡلَحَ ٱلۡمُؤۡمِنُونَ" },
          { s: 23, a: 2, name: "المؤمنون", text: "ٱلَّذِينَ هُمۡ فِي صَلَاتِهِمۡ خَٰشِعُونَ" },
          { s: 25, a: 74, name: "الفرقان", text: "وَٱلَّذِينَ يَقُولُونَ رَبَّنَا هَبۡ لَنَا مِنۡ أَزۡوَٰجِنَا وَذُرِّيَّٰتِنَا قُرَّةَ أَعۡيُنٖ وَٱجۡعَلۡنَا لِلۡمُتَّقِينَ إِمَامًا" },
          { s: 26, a: 80, name: "الشعراء", text: "وَإِذَا مَرِضۡتُ فَهُوَ يَشۡفِينِ" },
          { s: 29, a: 45, name: "العنكبوت", text: "ٱتۡلُ مَآ أُوحِيَ إِلَيۡكَ مِنَ ٱلۡكِتَٰبِ وَأَقِمِ ٱلصَّلَوٰةَۖ إِنَّ ٱلصَّلَوٰةَ تَنۡهَىٰ عَنِ ٱلۡفَحۡشَآءِ وَٱلۡمُنكَرِۗ وَلَذِكۡرُ ٱللَّهِ أَكۡبَرُۗ وَٱللَّهُ يَعۡلَمُ مَا تَصۡنَعُونَ" },
          { s: 33, a: 41, name: "الأحزاب", text: "يَٰٓأَيُّهَا ٱلَّذِينَ ءَامَنُواْ ٱذۡكُرُواْ ٱللَّهَ ذِكۡرٗا كَثِيرٗا" },
          { s: 33, a: 42, name: "الأحزاب", text: "وَسَبِّحُوهُ بُكۡرَةٗ وَأَصِيلًا" },
          { s: 39, a: 53, name: "الزمر", text: "۞ قُلۡ يَٰعِبَادِيَ ٱلَّذِينَ أَسۡرَفُواْ عَلَىٰٓ أَنفُسِهِمۡ لَا تَقۡنَطُواْ مِن رَّحۡمَةِ ٱللَّهِۚ إِنَّ ٱللَّهَ يَغۡفِرُ ٱلذُّنُوبَ جَمِيعًاۚ إِنَّهُۥ هُوَ ٱلۡغَفُورُ ٱلرَّحِيمُ" },
          { s: 40, a: 60, name: "غافر", text: "وَقَالَ رَبُّكُمُ ٱدۡعُونِيٓ أَسۡتَجِبۡ لَكُمۡۚ إِنَّ ٱلَّذِينَ يَسۡتَكۡبِرُونَ عَنۡ عِبَادَتِي سَيَدۡخُلُونَ جَهَنَّمَ دَاخِرِينَ" },
          { s: 47, a: 7, name: "محمد", text: "يَٰٓأَيُّهَا ٱلَّذِينَ ءَامَنُوٓاْ إِن تَنصُرُواْ ٱللَّهَ يَنصُرۡكُمۡ وَيُثَبِّتۡ أَقۡدَامَكُمۡ" },
          { s: 50, a: 16, name: "ق", text: "وَلَقَدۡ خَلَقۡنَا ٱلۡإِنسَٰنَ وَنَعۡلَمُ مَا تُوَسۡوِسُ بِهِۦ نَفۡسُهُۥۖ وَنَحۡنُ أَقۡرَبُ إِلَيۡهِ مِنۡ حَبۡلِ ٱلۡوَرِيدِ" },
          { s: 51, a: 56, name: "الذاريات", text: "وَمَا خَلَقۡتُ ٱلۡجِنَّ وَٱلۡإِنسَ إِلَّا لِيَعۡبُدُونِ" },
          { s: 62, a: 9, name: "الجمعة", text: "يَٰٓأَيُّهَا ٱلَّذِينَ ءَامَنُوٓاْ إِذَا نُودِيَ لِلصَّلَوٰةِ مِن يَوۡمِ ٱلۡجُمُعَةِ فَٱسۡعَوۡاْ إِلَىٰ ذِكۡرِ ٱللَّهِ وَذَرُواْ ٱلۡبَيۡعَۚ ذَٰلِكُمۡ خَيۡرٞ لَّكُمۡ إِن كُنتُمۡ تَعۡلَمُونَ" },
          { s: 65, a: 3, name: "الطلاق", text: "وَيَرۡزُقۡهُ مِنۡ حَيۡثُ لَا يَحۡتَسِبُۚ وَمَن يَتَوَكَّلۡ عَلَى ٱللَّهِ فَهُوَ حَسۡبُهُۥٓۚ إِنَّ ٱللَّهَ بَٰلِغُ أَمۡرِهِۦۚ قَدۡ جَعَلَ ٱللَّهُ لِكُلِّ شَيۡءٖ قَدۡرٗا" },
          { s: 70, a: 23, name: "المعارج", text: "ٱلَّذِينَ هُمۡ عَلَىٰ صَلَاتِهِمۡ دَآئِمُونَ" },
    
        ],
        AYAH_PERIOD = 2 * 60 * 1000,
        shownAyah = -1;
      // The verse is chosen from the clock, so it changes every two minutes
      // and survives restarts without repeating from the start.
      function renderAyah() {
        var i = Math.floor(Date.now() / AYAH_PERIOD) % VERSES.length,
          box = $("ayah");
        if (i === shownAyah) return;
        var first = shownAyah < 0,
          show = function () {
            var v = VERSES[i];
            // No ﴿ ﴾ brackets: the TV's Noto font draws them as plain braces.
            $("ayah-text").textContent = v.text;
            $("ayah-ref").textContent = "سورة " + v.name + " · " + v.a;
            box.classList.remove("out");
          };
        shownAyah = i;
        if (first) return show();
        box.classList.add("out");
        setTimeout(show, 1200);
      }
      function renderPrayers() {
        var parts = new Intl.DateTimeFormat("en-GB", {
            timeZone: "Asia/Riyadh",
            hour: "2-digit",
            minute: "2-digit",
            second: "2-digit",
            hour12: false,
          })
            .format(new Date())
            .split(":"),
          seconds = +parts[0] * 3600 + +parts[1] * 60 + +parts[2],
          times = days[dayKey(0)],
          selection = nextPrayer(times, days[dayKey(1)], seconds);
        // Only problems get a status line; normally it is empty and hidden.
        $("status").textContent = times
          ? ""
          : prayersFailed
            ? "المواقيت غير متاحة حاليًا · تحقق من اتصال الإنترنت"
            : "جارٍ تحميل مواقيت الصلاة";
        // After Isha the highlighted row is Fajr, counting down to tomorrow's.
        var active = selection ? (selection.index < 0 ? 0 : selection.index) : -1,
          html = "";
        names.forEach(function (item, i) {
          var left = "";
          if (i === active && selection.remaining !== null) {
            left =
              '<span class="left">' +
              (selection.index < 0 ? "غدًا " : "") +
              remainingText(selection.remaining) +
              "</span>";
          }
          html +=
            '<div class="prayer' +
            (i === active ? " active" : "") +
            '"><span>' +
            item[1] +
            left +
            '</span><span class="num">' +
            formatTime(times && times[item[0]], true) +
            "</span></div>";
        });
        $("prayers").innerHTML = html;
      }
      function weatherName(code) {
        if (code === 0) return "سماء صافية";
        if (code <= 3) return "غائم جزئيًا";
        if (code <= 48) return "ضباب";
        if (code <= 67) return "أمطار";
        if (code <= 77) return "ثلوج";
        if (code <= 82) return "زخات مطر";
        if (code <= 99) return "عواصف رعدية";
        return "الطقس الآن";
      }
      // The live reading while it is from this hour; otherwise this hour's
      // entry in the cached hourly forecast (Open-Meteo times are Riyadh-local).
      function currentWeather() {
        if (!weather) return null;
        var hour =
            dayKey(0).split("-").reverse().join("-") +
            "T" +
            new Intl.DateTimeFormat("en-GB", {
              timeZone: "Asia/Riyadh",
              hour: "2-digit",
              hour12: false,
            }).format(new Date()) +
            ":00",
          cur = weather.current,
          hourly = weather.hourly,
          i = hourly && hourly.time ? hourly.time.indexOf(hour) : -1;
        if (cur && String(cur.time).slice(0, 13) === hour.slice(0, 13)) {
          return { temperature: cur.temperature_2m, code: cur.weather_code };
        }
        if (i < 0 || typeof hourly.temperature_2m[i] !== "number") return null;
        return {
          temperature: hourly.temperature_2m[i],
          code: hourly.weather_code[i],
        };
      }
      function renderWeather() {
        var w = currentWeather();
        if (w) {
          $("temperature").textContent = ar(Math.round(w.temperature)) + "°";
          $("weather").textContent = weatherName(w.code);
        } else if (weather || weatherFailed) {
          $("temperature").textContent = "";
          $("weather").textContent = "الطقس غير متاح حاليًا";
        }
      }
      window.setData = function (kind, raw) {
        try {
          var d = JSON.parse(raw);
          if (kind === "weather") {
            if (typeof d.current.temperature_2m !== "number") throw Error();
            weather = d;
            renderWeather();
          } else {
            // A week from the range endpoint, or a single day from older caches.
            var list = [].concat(d.data),
              keep = {};
            for (var n = 0; n < 9; n++) keep[dayKey(n)] = true;
            list.forEach(function (day) {
              var date = day.date.gregorian.date;
              if (!day.timings || !day.timings.Fajr) throw Error();
              if (keep[date]) days[date] = day.timings;
            });
            for (var key in days) if (!keep[key]) delete days[key];
            renderSky();
            renderPrayers();
          }
        } catch (e) {
          window.setError(kind);
        }
      };
      window.setError = function (kind) {
        if (kind === "weather") {
          weatherFailed = true;
          renderWeather();
        } else {
          prayersFailed = true;
          renderPrayers();
        }
      };
      renderClock();
      setInterval(renderClock, 1000);
      setTimeout(function () {
        document.body.classList.remove("boot");
      }, 1000);
    </script>
